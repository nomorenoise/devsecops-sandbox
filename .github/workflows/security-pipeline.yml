name: Python DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sec-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.10'

      # 1. SAST (Static Application Security Testing) using Semgrep
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config auto --error
        # continue-on-error: true

      # 2. SCA (Software Composition Analysis) using pip-audit
      # Add if: always() so this runs even if Semgrep fails
      - name: Install dependencies
        if: always()
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit Vulnerability Scan
        if: always()
        uses: pypa/gh-action-pip-audit@82f9d784a0d9b54ce0ea1a94160a2ba19e6f883c # v1.1.0
        with:
          inputs: requirements.txt

